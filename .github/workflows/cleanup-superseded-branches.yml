name: One-time cleanup of superseded FragCity branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-superseded-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Close out stale feature refs
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed and superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          branches=(
            "feat/zarinpal-cs2-server-orders"
            "fix/cs2-service-config-option-persistence"
            "fix/paymenter-rial-only-currency"
            "native-paymenter-config-options"
            "feat/config-option-resource-limits"
          )

          failed=0
          for branch in "${branches[@]}"; do
            ref="repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            if gh api --silent --method DELETE "$ref"; then
              echo "Deleted branch: $branch"
            elif gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "::error::Could not delete branch: $branch"
              failed=1
            else
              echo "Already absent: $branch"
            fi
          done

          if (( failed != 0 )); then
            exit 1
          fi

      - name: Remove this one-time cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_path=".github/workflows/cleanup-superseded-branches.yml"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=main" --jq .sha)"
          gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message="Remove one-time branch cleanup workflow" \
            -f sha="$sha" \
            -f branch=main
