name: FragCity API PHP Checks

on:
  push:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - ".github/workflows/fragcity-api-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - ".github/workflows/fragcity-api-php.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax-and-contract:
    name: PHP 8.3 FragCity bridge and native Config Option checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Lint every FragCityAPI PHP file
        shell: bash
        run: |
          set -euo pipefail
          test -f extensions/Others/FragCityAPI/FragCityAPI.php
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find extensions/Others/FragCityAPI -type f -name '*.php' -print0 | sort -z)

      - name: Validate native checkout SSO contract
        shell: bash
        run: |
          set -euo pipefail
          api="extensions/Others/FragCityAPI/FragCityAPI.php"
          routes="extensions/Others/FragCityAPI/routes.php"
          manifest="extensions/Servers/FragCityCS2/resources/cs2-egg-variables.json"
          server_extension="extensions/Servers/FragCityCS2/FragCityCS2.php"

          grep -Fq "version: '1.6.0'" "$api"
          grep -Fq "function createCheckoutUrl" "$api"
          grep -Fq "function checkoutLogin" "$api"
          grep -Fq "Cache::pull($cacheKey)" "$api"
          grep -Fq "Auth::guard('web')->login($user, false)" "$api"
          grep -Fq "products.checkout" "$api"
          grep -Fq "checkout-url" "$routes"
          grep -Fq "checkout-login/{token}" "$routes"
          ! grep -Fq "function createCs2Order" "$api"
          ! grep -Fq "orders/cs2" "$routes"
          ! grep -Fq '$resourceConfigTargets' "$api"
          ! grep -Fq 'cs2_plan_id_' "$api"
          ! grep -Fq 'cs2_currency_unit' "$api"
          grep -Fq "'cs2_product_id'" "$api"
          grep -Fq "function getCheckoutConfig" "$server_extension"
          grep -Fq "'config_option'" "$server_extension"

          php -r '
            $manifest = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $fields = array_column($manifest["paymenter"]["checkout_fields"] ?? [], "name");
            $expected = ["SRCDS_MAP", "EXEC", "MAPGROUP", "COOLDOWN", "ENABLE_GUARD", "GUARD_BAN_MINUTES"];
            sort($fields);
            sort($expected);
            if ($fields !== $expected) {
              fwrite(STDERR, "CS2 extension Checkout manifest does not match the six-field contract.\\n");
              exit(1);
            }
            if ((int) ($manifest["summary"]["config_options"] ?? 0) !== 2) {
              fwrite(STDERR, "CS2 manifest must declare two native Egg Config Options.\\n");
              exit(1);
            }
            $statuses = [];
            foreach ($manifest["variables"] ?? [] as $variable) {
              $statuses[$variable["env_variable"] ?? ""] = $variable["paymenter"]["status"] ?? "";
            }
            if (($statuses["SRCDS_MAXPLAYERS"] ?? "") !== "config_option"
                || ($statuses["TICKRATE"] ?? "") !== "config_option") {
              fwrite(STDERR, "Player Slots and Tickrate must be native Paymenter Config Options.\\n");
              exit(1);
            }
            echo "Native Paymenter Config Option manifest contract OK", PHP_EOL;
          ' "$manifest"
