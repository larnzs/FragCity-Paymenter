name: FragCity API PHP Checks

on:
  push:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - "extensions/Gateways/ZarinPal/**"
      - "tools/validate-fragcity-paymenter.sh"
      - ".github/workflows/fragcity-api-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - "tools/validate-fragcity-paymenter.sh"
      - ".github/workflows/fragcity-api-php.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax-and-contract:
    name: PHP 8.3 FragCityAPI and Paymenter contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Lint and validate the complete FragCity Paymenter contract
        run: bash tools/validate-fragcity-paymenter.sh
