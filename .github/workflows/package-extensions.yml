name: Release FragCity Packages

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "themes/fragcity/**"
      - "tools/package-extensions.sh"
      - "tools/package-release.sh"
      - "tools/validate-fragcity-paymenter.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fragcity-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish one versioned Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP for release validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Validate PHP, billing and provisioning before publishing
        run: bash tools/validate-fragcity-paymenter.sh

      - name: Generate unique Release tag
        id: release-meta
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="fragcity-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag"

      - name: Build and validate Extension and Theme packages
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-meta.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          bash tools/package-release.sh "$RUNNER_TEMP/fragcity-release" "$RELEASE_TAG"

      - name: Prepare Release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-meta.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/FRAGCITY-RELEASE-NOTES.md" <<'NOTES'
          # FragCity Release

          This Release contains the current FragCity Paymenter add-ons and the FragCity Paymenter theme source bundle, built from the exact source commit shown on this Release.

          ## Paymenter Extensions

          Upload each of these ZIPs separately from Admin → Extensions → Upload Extension:

          1. FragCityAPI-v*.zip — install under Others.
          2. FragCitySupportAPI-v*.zip — install under Others.
          3. FragCityCS2-v*.zip — install under Servers.

          Install/update order: FragCityAPI → FragCitySupportAPI → FragCityCS2.

          ## FragCity Paymenter Theme

          FragCityPaymenterTheme-*.zip is a source bundle, not a Paymenter Extension. Do not upload it through Extension Uploader.

          Extract its fragcity/ directory into the Paymenter installation's themes/ directory. From the Paymenter installation root, rebuild its Vite assets with:

          npm run build -- fragcity

          This uses the Node dependencies already installed for the matching Paymenter version. The theme ZIP does not contain Paymenter Core, vendor, node_modules, runtime settings or secrets.

          ## Integrity

          Verify downloaded ZIPs with SHA256SUMS. PACKAGES.txt lists the packaged components and source revision. THEME-PACKAGE.txt explains the theme bundle boundary.

          ## Compatibility and safety

          Compatibility target: Paymenter v1.5.9, PHP 8.3/8.4. Back up the active extension/theme directories and database before updating. Never overwrite a newer installed FragCityAPI version with an older one without reviewing the code differences.
          NOTES

      - name: Upload a secondary Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: fragcity-release-${{ steps.release-meta.outputs.release_tag }}
          path: |
            ${{ runner.temp }}/fragcity-release/
            ${{ runner.temp }}/FRAGCITY-RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release with all install packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          package_dir="$RUNNER_TEMP/fragcity-release"
          gh release create "$RELEASE_TAG" \
            "$package_dir"/*.zip \
            "$package_dir/SHA256SUMS" \
            "$package_dir/PACKAGES.txt" \
            "$package_dir/THEME-PACKAGE.txt" \
            --target "$GITHUB_SHA" \
            --title "FragCity $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/FRAGCITY-RELEASE-NOTES.md"
          echo "Published: $(gh release view "$RELEASE_TAG" --json url --jq .url)"
