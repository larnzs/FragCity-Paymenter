name: Release FragCity Packages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-extensions.yml"
      - "extensions/**"
      - "themes/fragcity/**"
      - "tools/package-extensions.sh"
      - "tools/package-release.sh"
      - "tools/package-theme-deploy.sh"
      - "tools/validate-fragcity-paymenter.sh"
      - "tools/validate-fragcity-theme-views.php"
      - "README.md"
      - "docs/INSTALL-THEME.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fragcity-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish one versioned Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FragCity add-ons and theme
        uses: actions/checkout@v4

      - name: Checkout upstream Paymenter v1.5.9 build environment
        uses: actions/checkout@v4
        with:
          repository: Paymenter/Paymenter
          ref: v1.5.9
          path: paymenter-core

      - name: Set up PHP for release validation and Blade compilation
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js for Vite production build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paymenter-core/package-lock.json

      - name: Install upstream build dependencies
        working-directory: paymenter-core
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts
          npm ci

      - name: Overlay FragCity theme and build production Vite assets
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf paymenter-core/themes/fragcity
          cp -a "$GITHUB_WORKSPACE/themes/fragcity" paymenter-core/themes/fragcity
          cd paymenter-core
          npm run build -- fragcity
          test -s public/fragcity/manifest.json

      - name: Compile all FragCity Blade views with Laravel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd paymenter-core
          cat > .env <<'ENV'
          APP_NAME=Paymenter
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          CACHE_STORE=file
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr
          ENV
          php "$GITHUB_WORKSPACE/tools/validate-fragcity-theme-views.php" "$GITHUB_WORKSPACE/paymenter-core"

      - name: Validate PHP, billing and provisioning before publishing
        run: bash tools/validate-fragcity-paymenter.sh

      - name: Generate unique Release tag
        id: release-meta
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="fragcity-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag"

      - name: Build and validate Extension and deploy-ready Theme packages
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-meta.outputs.release_tag }}
          PAYMENTER_BUILD_ROOT: ${{ github.workspace }}/paymenter-core
        run: |
          set -Eeuo pipefail
          bash tools/package-release.sh "$RUNNER_TEMP/fragcity-release" "$RELEASE_TAG"

      - name: Prepare Release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-meta.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/FRAGCITY-RELEASE-NOTES.md" <<'NOTES'
          # FragCity Release

          This Release contains the current FragCity Paymenter add-ons and a deploy-ready FragCity Theme overlay, built against upstream Paymenter v1.5.9 from the exact source commit shown on this Release.

          ## Paymenter Extensions

          Upload each of these ZIPs separately from Admin → Extensions → Upload Extension:

          1. FragCityAPI-v*.zip — install under Others.
          2. FragCitySupportAPI-v*.zip — install under Others.
          3. FragCityCS2-v*.zip — install under Servers.
          4. ZarinPal-v*.zip — install under Gateways.

          Install/update order: FragCityAPI → FragCitySupportAPI → FragCityCS2 → ZarinPal.

          ## FragCity Paymenter Theme — deploy-ready

          FragCityPaymenterTheme-*.zip is a Laravel Theme overlay, not a Paymenter Extension. Never upload it through the Extension Uploader.

          The ZIP includes both:
          - themes/fragcity/ — Blade views, theme.php, CSS and JS source.
          - public/fragcity/ — Vite manifest and precompiled production assets.

          For a shared host without SSH:
          1. Back up the existing themes/fragcity and public/fragcity folders.
          2. Upload the ZIP through File Manager to the Paymenter application root.
          3. Extract it at the application root and merge the themes/ and public/ directories.
          4. Keep/select FragCity in Paymenter Settings → Theme after both paths exist.

          No Node.js, npm, Composer or SSH command is required on the hosting account. Do not overwrite .env, vendor, app, database, storage or bootstrap.

          ## Integrity

          Verify downloaded ZIPs with SHA256SUMS. PACKAGES.txt lists the packaged components and source revision. THEME-PACKAGE.txt describes the theme overlay and installation boundary.

          ## Compatibility and safety

          Compatibility target: Paymenter v1.5.9, PHP 8.3/8.4. Back up the database and active extension/theme directories before updating. Never overwrite a newer installed FragCityAPI version with an older one without reviewing the code differences.
          NOTES

      - name: Upload a secondary Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: fragcity-release-${{ steps.release-meta.outputs.release_tag }}
          path: |
            ${{ runner.temp }}/fragcity-release/
            ${{ runner.temp }}/FRAGCITY-RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release with all install packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          package_dir="$RUNNER_TEMP/fragcity-release"
          gh release create "$RELEASE_TAG" \
            "$package_dir"/*.zip \
            "$package_dir/SHA256SUMS" \
            "$package_dir/PACKAGES.txt" \
            "$package_dir/THEME-PACKAGE.txt" \
            --target "$GITHUB_SHA" \
            --title "FragCity $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/FRAGCITY-RELEASE-NOTES.md"
          echo "Published: $(gh release view "$RELEASE_TAG" --json url --jq .url)"
