name: FragCity PHP Checks

on:
  push:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - "extensions/Gateways/ZarinPal/**"
      - ".github/workflows/fragcity-lifecycle-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - "extensions/Gateways/ZarinPal/**"
      - ".github/workflows/fragcity-lifecycle-php.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP 8.3 native checkout and provisioning contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint FragCity bridge, server and Gateway files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "extensions/Others/FragCityAPI/FragCityAPI.php"
            "extensions/Others/FragCityAPI/routes.php"
            "extensions/Servers/FragCityCS2/FragCityCS2.php"
            "extensions/Gateways/ZarinPal/ZarinPal.php"
            "extensions/Gateways/ZarinPal/routes.php"
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          migration_dir="extensions/Others/FragCityAPI/database/migrations"
          test -d "$migration_dir"
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find "$migration_dir" -maxdepth 1 -type f -name '*.php' -print0 | sort -z)

      - name: Verify native checkout, SSO and Gateway contracts
        shell: bash
        run: |
          set -euo pipefail
          api="extensions/Others/FragCityAPI/FragCityAPI.php"
          routes="extensions/Others/FragCityAPI/routes.php"
          server="extensions/Servers/FragCityCS2/FragCityCS2.php"
          server_readme="extensions/Servers/FragCityCS2/README.md"
          api_readme="extensions/Others/FragCityAPI/README.md"
          gateway="extensions/Gateways/ZarinPal/ZarinPal.php"
          manifest="extensions/Servers/FragCityCS2/resources/cs2-egg-variables.json"

          grep -Fq "version: '1.6.0'" "$api"
          grep -Fq "'version' => '1.6.0'" "$api"
          grep -Fq "version: '1.4.0'" "$server"
          grep -Fq '$this->ensurePterodactylClientUser($service, true);' "$server"
          grep -Fq 'return parent::createServer($service, $settings, $properties);' "$server"
          grep -Fq "function createCheckoutUrl" "$api"
          grep -Fq "function checkoutLogin" "$api"
          grep -Fq 'Cache::pull($cacheKey)' "$api"
          ! grep -Fq "function createCs2Order" "$api"
          ! grep -Fq "orders/cs2" "$routes"
          ! grep -Fq '$resourceConfigTargets' "$api"
          ! grep -Fq 'cs2_plan_id_' "$api"
          ! grep -Fq "function reconcileCustomerLifecycle" "$server"
          ! grep -Fq "function connectClientApi" "$api"

          routes_count="$(grep -c "Route::post('/api/v1/fragcity/bridge/" "$routes")"
          readme_count="$(grep -c -- '- `POST /api/v1/fragcity/bridge/' "$api_readme")"
          test "$routes_count" -eq 6
          test "$readme_count" -eq "$routes_count"
          grep -Fq "GET /extensions/fragcity-api/checkout-login/{token}" "$api_readme"
          grep -Fq "Native Product Config Options" "$server_readme"
          grep -Fq "SRCDS_MAXPLAYERS" "$server_readme"
          grep -Fq "TICKRATE" "$server_readme"

          grep -Fq "class ZarinPal extends Gateway" "$gateway"
          grep -Fq "/request.json" "$gateway"
          grep -Fq "/verify.json" "$gateway"
          grep -Fq "ExtensionHelper::addPayment(" "$gateway"
          grep -Fq "alreadyRecorded->status === InvoiceTransactionStatus::Succeeded" "$gateway"

          php -r '
            $manifest = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $fields = array_column($manifest["paymenter"]["checkout_fields"] ?? [], "name");
            $expected = ["SRCDS_MAP", "EXEC", "MAPGROUP", "COOLDOWN", "ENABLE_GUARD", "GUARD_BAN_MINUTES"];
            sort($fields);
            sort($expected);
            if ($fields !== $expected || (int) ($manifest["summary"]["config_options"] ?? 0) !== 2) {
              fwrite(STDERR, "CS2 native Checkout manifest contract failed.\\n");
              exit(1);
            }
            echo "CS2 manifest contract OK", PHP_EOL;
          ' "$manifest"
