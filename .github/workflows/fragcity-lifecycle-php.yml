name: FragCity PHP Checks

on:
  push:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - "tools/validate-fragcity-paymenter.sh"
      - ".github/workflows/fragcity-lifecycle-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions/Others/FragCityAPI/**"
      - "extensions/Servers/FragCityCS2/**"
      - "tools/validate-fragcity-paymenter.sh"
      - ".github/workflows/fragcity-lifecycle-php.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP 8.3 syntax, billing and provisioning contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Validate PHP syntax, native billing and provisioning contracts
        run: bash tools/validate-fragcity-paymenter.sh
